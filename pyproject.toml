[project]
name = "static-contextual-ambiguity"
version = "0.1.0"
description = "A reproducible Word-in-Context comparison of static and contextual embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Research and educational use; upstream datasets and models retain their own licenses" }
authors = [{ name = "University of Trier MSc NLP project" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "matplotlib>=3.10.6,<4",
  "numpy>=2.3.2,<3",
  "pandas>=2.3.2,<4",
  "pillow>=11.3.0,<13",
  "pypdf>=6.0.0,<7",
  "pyyaml>=6.0.2,<7",
  "scikit-learn>=1.7.1,<2",
  "scipy>=1.16.1,<2",
  "torch>=2.11.0,<2.12",
  "tqdm>=4.67.1,<5",
  "transformers>=5.0.0,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<10",
  "pytest-cov>=6.2.1,<8",
  "ruff>=0.12.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/lexical_ambiguity"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "results", "figures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
